# VGoalsPlanner UI в Docker: статика + /api в контейнер API ("vgplanner-api" в сети стека).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Вложения задач: до Attachments:MaxFileSizeBytes (50 МБ) плюс запас на multipart.
    client_max_body_size 60m;

    location /api/ {
        proxy_pass http://vgplanner-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Файлы сборки с хешем не меняются; index.html всегда свежий, чтобы подхватить новую сборку.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Маршруты клиента обслуживает index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
